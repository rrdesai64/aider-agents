[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aider-agents"
version = "0.1.0"
description = "Subagent system for Aider — Explore, Plan, Task, Review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0,<1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "aider-chat>=0.50.0,<1.0.0",
]

[project.optional-dependencies]
web-search = [
    "tavily-python>=0.5.0,<1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tavily-python>=0.5.0,<1.0.0",
]

[project.scripts]
aider-agents = "aider_agents.__main__:main"
aider-agents-check = "compatibility.checker:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "compatibility", "orchestrator.py", "mcp_server.py", "__main__.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
